[project]
name = "reporeaper"
version = "5.2.0"
description = "An intelligent, agentic system for automated architectural analysis and semantic code search"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "RepoReaper Team"}
]
keywords = ["rag", "code-analysis", "ast", "vector-search", "github", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Web 框架与服务器
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "gunicorn>=21.2.0",
    "sse-starlette>=1.6.5",
    
    # HTTP 客户端与工具
    "httpx>=0.24.0",
    "python-dotenv>=1.0.0",
    
    # AI 与 向量数据库
    "openai>=1.0.0",
    "groq>=0.4.0",
    "chromadb>=0.4.0",
    "rank-bm25>=0.2.2",
    "pysqlite3-binary",
    
    # GitHub API
    "PyGithub>=1.59.0",
    
    # 数据处理
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
# dev-dependencies 已弃用，使用 project.optional-dependencies.dev 代替

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.black]
line-length = 120
target-version = ["py310"]
